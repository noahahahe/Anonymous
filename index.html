async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    throw new Error("no clipboard api");
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

function dateRangeArray(startISO, endISO) {
  const out = [];
  let d = new Date(startISO);
  const end = new Date(endISO || startISO);
  if (isNaN(d) || isNaN(end)) return out;
  while (d <= end) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}
function pad2(n) { return String(n).padStart(2, "0"); }

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    if (res && res.value) return JSON.parse(res.value);
    return fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

/* ============================================================
   核心計算：批次成本 -> 單筆訂單成本
   ============================================================ */
function computeCost(order, batch) {
  if (!batch) return null;
  const price = Number(order.itemPriceKRW) || 0;
  const weight = Number(order.weight) || 0;
  const feePct = Number(batch.feePercent) || 0;
  const shipPerKg = Number(batch.intlShipPerKg) || 0;
  const customsPerKg = Number(batch.customsPerKgTWD) || 0;
  const rate = Number(batch.exchangeRate) || 0;

  const itemCostKRW = price * (1 + feePct / 100);
  const intlShipKRW = shipPerKg * weight;
  const subTWD = rate > 0 ? (itemCostKRW + intlShipKRW) / rate : 0;
  const customsTWD = customsPerKg * weight;
  const totalCostTWD = subTWD + customsTWD;
  return {
    itemCostKRW, intlShipKRW, subTWD, customsTWD, totalCostTWD,
  };
}

function orderProfit(order, batch) {
  const cost = computeCost(order, batch);
  if (!cost) return null;
  const sell = Number(order.sellPriceTWD) || 0;
  const profit = sell - cost.totalCostTWD;
  const marginPct = sell > 0 ? (profit / sell) * 100 : 0;
  return { ...cost, sell, profit, marginPct };
}

function Dashboard({ orders, batches, expenses, setTab, onExport, onImportFile, importMsg }) {
  const batchMap = useMemo(() => Object.fromEntries(batches.map(b => [b.id, b])), [batches]);

  const stats = useMemo(() => {
    let revenue = 0, cost = 0, unpaid = 0, count = orders.length;
    let pendingArrival = 0;
    for (const o of orders) {
      const b = batchMap[o.batchId];
      const p = orderProfit(o, b);
      if (p) { revenue += p.sell; cost += p.totalCostTWD; }
      const due = (Number(o.sellPriceTWD) || 0) + (Number(o.shippingFeeToCustomer) || 0);
      const paid = Number(o.paidAmount) || 0;
      unpaid += Math.max(0, due - paid);
      if (o.arrivalStatus !== "已到台") pendingArrival++;
    }
    const expenseTotal = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const netProfit = revenue - cost - expenseTotal;
    return { revenue, cost, unpaid, count, pendingArrival, expenseTotal, netProfit };
  }, [orders, batchMap, expenses]);

  const thisMonth = new Date().toISOString().slice(0, 7);
  const monthOrders = orders.filter(o => monthKey(o.orderDate) === thisMonth);

  const cards = [
    { label: "本月訂單", value: monthOrders.length, unit: "筆", tab: "orders" },
    { label: "待到貨/處理", value: stats.pendingArrival, unit: "筆", tab: "orders", warn: stats.pendingArrival > 0 },
    { label: "未收款項", value: fmt(stats.unpaid), unit: "元", tab: "orders", warn: stats.unpaid > 0 },
    { label: "累積淨利", value: fmt(stats.netProfit), unit: "元", tab: "summary" },
  ];

  return (

/* ============================================================
   報價設定 + 報價計算
   ============================================================ */
function effectivePriceKRW(item, today) {
  const hasSale = item.saleEnd && item.salePriceKRW;
  if (hasSale) {
    const t = new Date(today).setHours(0,0,0,0);
    const e = new Date(item.saleEnd).setHours(0,0,0,0);
    if (t <= e) return { price: Number(item.salePriceKRW), onSale: true };
  }
  return { price: Number(item.originalPriceKRW) || 0, onSale: false };
}

function discountLabel(originalKRW, saleKRW) {
  const o = Number(originalKRW) || 0;
  const s = Number(saleKRW) || 0;
  if (o <= 0 || s <= 0) return "";
  const off = (s / o) * 10;
  return `${off.toFixed(1)}折`;
}

function computeQuote(item, quoteSettings, today) {
  const { price, onSale } = effectivePriceKRW(item, today);
  const rate = Number(quoteSettings.quoteRate) || 1;
  const fixedFee = Number(quoteSettings.fixedFee) || 0;
  const feePct = Number(quoteSettings.feePercent) || 0;
  const shipPerKg = Number(quoteSettings.intlShipPerKg) || 0;
  const domesticShipKRW = Number(quoteSettings.domesticShipKRW) || 0;
  const weight = Number(item.weight) || 0;
  const tiers = quoteSettings.tiers || [];
  let mult = tiers.length ? tiers[tiers.length - 1].mult : 1;
  for (const t of tiers) {
    if (price < Number(t.under)) { mult = t.mult; break; }
  }
  const itemCostKRW = price * (1 + feePct / 100);
  const shipKRW = shipPerKg * weight;
  const costTWD = (itemCostKRW + shipKRW + domesticShipKRW) / rate;
  const quote = costTWD * mult + fixedFee;
  const profit = quote - costTWD;
  const marginPct = quote > 0 ? (profit / quote) * 100 : 0;
  const minMargin = Number(quoteSettings.minMarginPct) || 0;
  const isLowMargin = marginPct < minMargin;
  const suggestedQuote = minMargin < 100 ? costTWD / (1 - minMargin / 100) : null;
  return { price, onSale, mult, itemCostKRW, costTWD, shipKRW, domesticShipKRW, quote, profit, marginPct, isLowMargin, suggestedQuote };
}

  quoteRate: 41,
  fixedFee: 30,

  tiers: [
    { under: 20000, mult: 1.3 },
    { under: 100000, mult: 1.2 },

function BatchesView({ batches, setBatches, orders }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (b) => { setEditing(b); setModalOpen(true); };
  const save = (f) => {
    if (editing) setBatches(prev => prev.map(b => b.id === editing.id ? { ...f, id: editing.id } : b));
    else setBatches(prev => [...prev, { ...f, id: uid() }]);
    setModalOpen(false);
  };
  const remove = (id) => {
    const inUse = orders.some(o => o.batchId === id);
    if (inUse && !window.confirm("此批次已有訂單使用，刪除後這些訂單將顯示「未指定批次」，確定刪除？")) return;
    setBatches(prev => prev.filter(b => b.id !== id));
  };

  return (
    <div style={{ padding: "4px 4px 90px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.stamp, letterSpacing: "0.1em" }}>
            CARGO LOT · 批次
          </div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: TOKENS.ink }}>
            批次成本設定
          </div>
        </div>
        <Button variant="stamp" onClick={openNew}><Plus size={16} /> 新增</Button>
      </div>
      <div style={{ fontSize: 12.5, color: TOKENS.inkSoft, marginBottom: 14, lineHeight: 1.5 }}>
        每次從韓國（或淘寶）寄送就建立一個批次，填入該批的匯率、運費、關稅率——之後這批次下的所有訂單會自動套用這些參數計算成本。
      </div>

      {batches.length === 0 ? (
        <EmptyState icon={Layers} title="尚未建立批次" desc="點右上角「新增」建立第一個批次" />
      ) : (
        batches.slice().reverse().map(b => {
          const batchOrders = orders.filter(o => o.batchId === b.id);
          const n = batchOrders.length;
          let batchRevenue = 0, batchCost = 0;
          for (const o of batchOrders) {
            const p = orderProfit(o, b);
            if (p) { batchRevenue += p.sell; batchCost += p.totalCostTWD; }
          }
          const batchNet = batchRevenue - batchCost;
          return (
            <div key={b.id} style={{
              background: TOKENS.white, borderRadius: 12, border: `1.5px solid ${TOKENS.line}`,
              padding: 13, marginBottom: 10, display: "flex", gap: 12,
            }}>
              <StampBadge label={b.label || "?"} size={48} />
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div style={{ fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif" }}>{n} 筆訂單</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => openEdit(b)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                      <Pencil size={15} color={TOKENS.inkSoft} />
                    </button>
                    <button onClick={() => remove(b.id)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                      <Trash2 size={15} color={TOKENS.stamp} />
                    </button>
                  </div>
                </div>
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2px 12px",
                  fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: TOKENS.inkSoft, marginTop: 6,
                }}>
                  <span>匯率 {b.exchangeRate || "-"}</span>
                  <span>手續費 {b.feePercent || 0}%</span>
                  <span>運費 {fmt(b.intlShipPerKg)}/kg₩</span>
                  <span>關稅 {fmt(b.customsPerKgTWD)}/kg NT</span>
                </div>
                {n > 0 && (
                  <div style={{
                    display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8,
                    borderTop: `1px dashed ${TOKENS.line}`,
                    fontFamily: "'IBM Plex Mono', monospace", fontSize: 12,
                  }}>
                    <span style={{ color: TOKENS.inkSoft }}>營收 {fmt(batchRevenue)}</span>
                    <span style={{ color: TOKENS.inkSoft }}>成本 {fmt(batchCost)}</span>
                    <span style={{ fontWeight: 700, color: TOKENS.ink }}>淨利 {fmt(batchNet)}</span>
                  </div>
                )}
              </div>
            </div>
          );
        })
      )}

      {modalOpen && (
        <Modal title={editing ? "編輯批次" : "新增批次"} onClose={() => setModalOpen(false)}>
          <BatchForm initial={editing} onSave={save} onCancel={() => setModalOpen(false)} />
        </Modal>
      )}
    </div>
  );
}

  const save = () => {
    if (editing) setExpenses(prev => prev.map(x => x.id === editing.id ? { ...f, id: editing.id } : x));
    else setExpenses(prev => [...prev, { ...f, id: uid() }]);
    setModalOpen(false);
  };
  const remove = (id) => setExpenses(prev => prev.filter(x => x.id !== id));

  const grouped = useMemo(() => {
    const g = {};
    for (const e of expenses) {
      const m = e.date ? e.date.slice(0, 7) : "未分類";
      if (!g[m]) g[m] = [];
      g[m].push(e);

  }, [expenses]);

        return (
          <div key={month} style={{ marginBottom: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, padding: "0 2px" }}>

  }, [items]);

  const grouped = useMemo(() => {
    const g = {};
    for (const it of items) {
      const b = it.brand || "未分類品牌";
      if (activeBrand !== "__all__" && b !== activeBrand) continue;
      if (!g[b]) g[b] = [];
      g[b].push(it);

              cursor: "pointer", fontFamily: "'Inter', sans-serif",

          {brandList.map(b => (

              style={{

                cursor: "pointer", fontFamily: "'Inter', sans-serif",

                background: activeBrand === b ? TOKENS.ink : TOKENS.white,

          {list.map(it => {

      )}

  );

/* ============================================================
   收支總結 Summary
   ============================================================ */
function TrendChart({ monthly }) {
  const chronological = monthly.slice(0, 6).slice().reverse();
  if (chronological.length === 0) {
    return (
      <div style={{ fontSize: 12, color: TOKENS.inkSoft, marginBottom: 18 }}>
        還沒有足夠資料可以畫趨勢圖
      </div>
    );
  }
  const nets = chronological.map(([, v]) => v.revenue - v.cost - v.expense);
  const maxAbs = Math.max(1, ...nets.map(n => Math.abs(n)));
  return (
    <div style={{
      display: "flex", alignItems: "flex-end", gap: 8, height: 140, marginBottom: 20,
      padding: "10px 4px 0", background: TOKENS.white, borderRadius: 12, border: `1.5px solid ${TOKENS.line}`,
    }}>
      {chronological.map(([month], i) => {
        const net = nets[i];
        const positive = net >= 0;
        const h = Math.max(4, (Math.abs(net) / maxAbs) * 84);
        return (
          <div key={month} style={{
            flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
            justifyContent: "flex-end", height: "100%",
          }}>
            <div style={{
              fontSize: 9, fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.inkSoft,
              marginBottom: 4, whiteSpace: "nowrap",
            }}>
              {positive ? "" : "-"}{fmt(Math.abs(net))}
            </div>
            <div style={{
              width: "70%", height: h, borderRadius: "4px 4px 0 0",
              background: positive ? TOKENS.ink : "transparent",
              border: positive ? "none" : `1.5px dashed ${TOKENS.inkSoft}`,
            }} />
            <div style={{
              fontSize: 9.5, color: TOKENS.inkSoft, marginTop: 6,
              fontFamily: "'IBM Plex Mono', monospace",
            }}>
              {month === "未分類" ? "—" : `${Number(month.slice(5))}月`}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SummaryView({ orders, batches, expenses }) {
  const batchMap = useMemo(() => Object.fromEntries(batches.map(b => [b.id, b])), [batches]);

  const monthly = useMemo(() => {
    const m = {};
    for (const o of orders) {
      const k = monthKey(o.orderDate) || "未分類";
      if (!m[k]) m[k] = { revenue: 0, cost: 0, expense: 0, count: 0 };
      const p = orderProfit(o, batchMap[o.batchId]);
      if (p) { m[k].revenue += p.sell; m[k].cost += p.totalCostTWD; }
      m[k].count++;
    }
    for (const e of expenses) {
      const k = e.date ? e.date.slice(0, 7) : "未分類";
      if (!m[k]) m[k] = { revenue: 0, cost: 0, expense: 0, count: 0 };
      m[k].expense += Number(e.amount) || 0;
    }
    return Object.entries(m).sort((a, b) => b[0].localeCompare(a[0]));
  }, [orders, expenses, batchMap]);

  const grand = monthly.reduce((s, [, v]) => ({
    revenue: s.revenue + v.revenue, cost: s.cost + v.cost, expense: s.expense + v.expense,
  }), { revenue: 0, cost: 0, expense: 0 });
  const grandNet = grand.revenue - grand.cost - grand.expense;

  return (
    <div style={{ padding: "4px 4px 90px" }}>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.stamp, letterSpacing: "0.1em" }}>
          BALANCE · 損益
        </div>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: TOKENS.ink }}>
          整體收支總結
        </div>
      </div>

      <div style={{
        background: TOKENS.ink, borderRadius: 14, padding: "18px 16px", color: TOKENS.paper, marginBottom: 22,
      }}>
        <div style={{ fontSize: 12, opacity: 0.7, marginBottom: 10, fontWeight: 600 }}>累積至今</div>
        <Row label="總營收" value={grand.revenue} />
        <Row label="商品+物流成本" value={-grand.cost} />
        <Row label="賣場支出" value={-grand.expense} />
        <div style={{ height: 1, background: "rgba(255,255,255,0.2)", margin: "10px 0" }} />
        <Row label="淨利" value={grandNet} bold />
        {grandNet >= 0 ? (
          <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, opacity: 0.75, marginTop: 8 }}>
            <TrendingUp size={13} /> 目前整體獲利
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, opacity: 0.9, marginTop: 8, color: "#FFFFFF", fontWeight: 700 }}>
            <TrendingDown size={13} /> 目前整體虧損
          </div>
        )}
      </div>

      <SectionLabel>近半年淨利趨勢</SectionLabel>
      <TrendChart monthly={monthly} />

      <SectionLabel>按月份</SectionLabel>
      {monthly.length === 0 ? (
        <EmptyState icon={Receipt} title="還沒有資料" desc="新增訂單與支出後這裡會自動彙總" />
      ) : monthly.map(([month, v]) => {
        const net = v.revenue - v.cost - v.expense;
        return (
          <div key={month} style={{
            background: TOKENS.white, borderRadius: 12, border: `1.5px solid ${TOKENS.line}`,
            padding: 13, marginBottom: 10,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15 }}>{month}</span>
              <span style={{
                fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 15,
                color: net >= 0 ? TOKENS.sage : TOKENS.stamp,
              }}>{net >= 0 ? "+" : "-"}{fmt(Math.abs(net))}</span>
            </div>
            <div style={{
              display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6,
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: TOKENS.inkSoft,
            }}>
              <div>營收<br /><b style={{ color: TOKENS.ink, fontSize: 13 }}>{fmt(v.revenue)}</b></div>
              <div>成本<br /><b style={{ color: TOKENS.ink, fontSize: 13 }}>{fmt(v.cost)}</b></div>
              <div>支出<br /><b style={{ color: TOKENS.ink, fontSize: 13 }}>{fmt(v.expense)}</b></div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ScheduleEventForm({ initial, defaultDate, brandEventCount, onSave, onCancel }) {
  const [f, setF] = useState(initial || {
    date: defaultDate, endDate: defaultDate, title: "", category: "上架", note: "",
  });
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const isBrand = f.category === "品牌活動";

  const handleSave = () => {
    const out = { ...f };
    if (!out.endDate || out.endDate < out.date) out.endDate = out.date;
    if (isBrand && out.colorIndex === undefined) out.colorIndex = (brandEventCount || 0) % HIGHLIGHT_PALETTE.length;
    onSave(out);
  };

  return (
    <div>
      <Field label="開始日期">
        <TextInput type="date" value={f.date} onChange={e => set("date", e.target.value)} />
      </Field>
      <Field label="結束日期" hint={isBrand ? "例：Bonnae換季特價 8/8–8/23" : "單日活動可留跟開始日期一樣"}>
        <TextInput type="date" value={f.endDate} onChange={e => set("endDate", e.target.value)} />
      </Field>
      <Field label="標題">
        <TextInput value={f.title} onChange={e => set("title", e.target.value)} placeholder="例：Grumpy stuff 上架" />
      </Field>
      <Field label="分類">
        <Select value={f.category} onChange={e => set("category", e.target.value)}>
          {SCHEDULE_CATS.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
        </Select>
      </Field>
      {isBrand && (
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          {HIGHLIGHT_PALETTE.map((c, i) => (
            <button
              key={i}
              type="button"
              onClick={() => set("colorIndex", i)}
              style={{
                width: 32, height: 32, borderRadius: 8, background: c.bg, cursor: "pointer",
                border: (f.colorIndex ?? ((brandEventCount || 0) % HIGHLIGHT_PALETTE.length)) === i
                  ? `2px solid ${TOKENS.ink}` : `2px solid transparent`,
              }}
            />
          ))}
        </div>
      )}
      <Field label="備註">
        <TextInput value={f.note} onChange={e => set("note", e.target.value)} placeholder="細節、連結、提醒事項" />
      </Field>
      <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
        <Button onClick={handleSave} style={{ flex: 1, justifyContent: "center" }}><Check size={15} /> 儲存</Button>
        <Button variant="ghost" onClick={onCancel}>取消</Button>
      </div>
    </div>
  );
}

function ScheduleView({ events, setEvents }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth()); // 0-indexed
  const [dayModal, setDayModal] = useState(null); // ISO date string
  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const todayISO = now.toISOString().slice(0, 10);
  const weeks = useMemo(() => getMonthMatrix(year, month), [year, month]);

  const eventsByDate = useMemo(() => {
    const m = {};
    for (const e of events) {
      if (!e.date) continue;
      const days = dateRangeArray(e.date, e.endDate || e.date);
      for (const iso of days) {
        if (!m[iso]) m[iso] = [];
        m[iso].push(e);
      }
    }
    return m;
  }, [events]);

  const monthEvents = useMemo(() => {
    const prefix = `${year}-${pad2(month + 1)}`;
    const monthStart = `${prefix}-01`;
    const monthEnd = `${prefix}-31`;
    return events.filter(e => {
      const s = e.date || "";
      const en = e.endDate || e.date || "";
      return en >= monthStart && s <= monthEnd;
    }).slice().sort((a, b) => a.date.localeCompare(b.date));
  }, [events, year, month]);

  const brandEventCount = useMemo(() => events.filter(isBrandEvent).length, [events]);

  const goPrev = () => { if (month === 0) { setYear(y => y - 1); setMonth(11); } else setMonth(m => m - 1); };
  const goNext = () => { if (month === 11) { setYear(y => y + 1); setMonth(0); } else setMonth(m => m + 1); };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth()); };

  const openDay = (iso) => setDayModal(iso);
  const openNewEvent = (iso) => { setEditing(null); setFormOpen(true); setDayModal(null); setPendingDate(iso); };
  const [pendingDate, setPendingDate] = useState(todayISO);
  const openEditEvent = (ev) => { setEditing(ev); setFormOpen(true); setDayModal(null); };

  const save = (f) => {
    if (editing) setEvents(prev => prev.map(e => e.id === editing.id ? { ...f, id: editing.id } : e));
    else setEvents(prev => [...prev, { ...f, id: uid() }]);
    setFormOpen(false);
  };
  const remove = (id) => setEvents(prev => prev.filter(e => e.id !== id));

  return (
    <div style={{ padding: "4px 4px 90px" }}>
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TOKENS.stamp, letterSpacing: "0.1em" }}>
          SCHEDULE · 行程
        </div>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: TOKENS.ink }}>
          上架 / 宣傳行程表
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={goPrev} style={{ background: "none", border: "none", cursor: "pointer", padding: 6 }}>
          <ChevronLeft size={20} color={TOKENS.ink} />
        </button>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 17 }}>
            {year}年{month + 1}月
          </span>
          <button onClick={goToday} style={{
            fontSize: 11, fontWeight: 600, color: TOKENS.inkSoft, background: TOKENS.paperDeep,
            border: "none", borderRadius: 6, padding: "3px 8px", cursor: "pointer",
          }}>今天</button>
        </div>
        <button onClick={goNext} style={{ background: "none", border: "none", cursor: "pointer", padding: 6 }}>
          <ChevronRight size={20} color={TOKENS.ink} />
        </button>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
        {SCHEDULE_CATS.map(c => (
          <div key={c.key} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: TOKENS.inkSoft }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color, display: "inline-block" }} />
            {c.key}
          </div>
        ))}
      </div>

      <div style={{
        background: TOKENS.white, borderRadius: 12, border: `1.5px solid ${TOKENS.line}`,
        overflow: "hidden", marginBottom: 20,
      }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", background: TOKENS.ink }}>
          {WEEKDAYS.map(w => (
            <div key={w} style={{ textAlign: "center", padding: "6px 0", color: TOKENS.paper, fontSize: 11.5, fontWeight: 600 }}>
              {w}
            </div>
          ))}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)" }}>
            {week.map((day, di) => {
              if (day === null) return <div key={di} style={{ minHeight: 54, borderRight: di < 6 ? `1px solid ${TOKENS.line}` : "none", borderTop: `1px solid ${TOKENS.line}` }} />;
              const iso = toISODate(year, month, day);
              const isToday = iso === todayISO;
              const dayEvents = eventsByDate[iso] || [];
              const brandEv = dayEvents.find(isBrandEvent);
              const dotEvents = dayEvents.filter(ev => !isBrandEvent(ev));
              const hc = brandEv ? HIGHLIGHT_PALETTE[(brandEv.colorIndex || 0) % HIGHLIGHT_PALETTE.length] : null;
              const isStart = brandEv && brandEv.date === iso;
              return (
                <div
                  key={di}
                  onClick={() => openDay(iso)}
                  style={{
                    minHeight: 54, padding: "4px 3px",
                    borderRight: di < 6 ? `1px solid ${TOKENS.line}` : "none",
                    borderTop: `1px solid ${TOKENS.line}`,
                    cursor: "pointer",
                    background: hc ? hc.bg : (isToday ? TOKENS.goldSoft : "transparent"),
                    position: "relative",
                  }}
                >
                  <div style={{
                    fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, fontWeight: isToday ? 700 : 500,
                    color: isToday ? TOKENS.gold : (hc ? hc.fg : TOKENS.ink), marginBottom: 3,
                  }}>{day}</div>
                  {isStart && (
                    <div style={{
                      fontSize: 9, fontWeight: 700, color: hc.fg,
                      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", marginBottom: 2,
                    }}>{brandEv.title}</div>
                  )}
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 2 }}>
                    {dotEvents.slice(0, 4).map(ev => (
                      <span key={ev.id} style={{
                        width: 6, height: 6, borderRadius: "50%",
                        background: scheduleCatColor(ev.category).color, display: "inline-block",
                      }} />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <SectionLabel>本月事項（{monthEvents.length}）</SectionLabel>
        <Button variant="stamp" onClick={() => openNewEvent(todayISO)}><Plus size={14} /> 新增</Button>
      </div>

      {monthEvents.length === 0 ? (
        <EmptyState icon={Calendar} title="本月還沒有排程" desc="點「新增」安排上架或宣傳時間" />
      ) : (
        monthEvents.map(ev => {
          const brand = isBrandEvent(ev);
          const c = brand ? HIGHLIGHT_PALETTE[(ev.colorIndex || 0) % HIGHLIGHT_PALETTE.length] : scheduleCatColor(ev.category);
          const d = new Date(ev.date);
          return (
            <div key={ev.id} onClick={() => openEditEvent(ev)} style={{
              display: "flex", alignItems: "center", gap: 10,
              background: brand ? c.bg : TOKENS.white, borderRadius: 10,
              border: `1.5px solid ${brand ? "transparent" : TOKENS.line}`,
              padding: "9px 12px", marginBottom: 7, cursor: "pointer",
            }}>
              <div style={{
                fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 700,
                color: brand ? c.fg : TOKENS.inkSoft,
                width: 30, textAlign: "center", flexShrink: 0,
              }}>
                {pad2(d.getDate())}<br /><span style={{ fontWeight: 400, fontSize: 10 }}>{WEEKDAYS[d.getDay()]}</span>
              </div>
              {!brand && <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color, flexShrink: 0 }} />}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: brand ? c.fg : TOKENS.ink }}>
                  {ev.title || "（未命名）"}
                </div>
                {ev.endDate && ev.endDate !== ev.date && (
                  <div style={{ fontSize: 11, color: brand ? c.fg : TOKENS.inkSoft, opacity: 0.8, marginTop: 1 }}>
                    {ev.date} ～ {ev.endDate}
                  </div>
                )}
                {ev.note && <div style={{ fontSize: 11.5, color: brand ? c.fg : TOKENS.inkSoft, opacity: 0.85, marginTop: 1 }}>{ev.note}</div>}
              </div>
              {!brand && <Pill bg={c.bg} fg={c.color}>{ev.category}</Pill>}
            </div>
          );
        })
      )}

      {dayModal && (
        <Modal title={dayModal} onClose={() => setDayModal(null)}>
          {(eventsByDate[dayModal] || []).length === 0 ? (
            <div style={{ fontSize: 13, color: TOKENS.inkSoft, marginBottom: 14 }}>這天還沒有安排事項</div>
          ) : (
            (eventsByDate[dayModal] || []).map(ev => {
              const brand = isBrandEvent(ev);
              const c = brand ? HIGHLIGHT_PALETTE[(ev.colorIndex || 0) % HIGHLIGHT_PALETTE.length] : scheduleCatColor(ev.category);
              return (
                <div key={ev.id} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  background: brand ? c.bg : TOKENS.white,
                  border: `1.5px solid ${brand ? "transparent" : TOKENS.line}`, borderRadius: 10,
                  padding: "9px 12px", marginBottom: 8,
                }}>
                  <div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                      {!brand && <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color }} />}
                      <span style={{ fontWeight: 600, fontSize: 13.5, color: brand ? c.fg : TOKENS.ink }}>{ev.title}</span>
                    </div>
                    {ev.endDate && ev.endDate !== ev.date && (
                      <div style={{ fontSize: 11, color: c.fg, opacity: 0.8, marginTop: 2 }}>{ev.date} ～ {ev.endDate}</div>
                    )}
                    {ev.note && <div style={{ fontSize: 11.5, color: brand ? c.fg : TOKENS.inkSoft, opacity: 0.85, marginTop: 2 }}>{ev.note}</div>}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => openEditEvent(ev)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                      <Pencil size={14} color={brand ? c.fg : TOKENS.inkSoft} />
                    </button>
                    <button onClick={() => remove(ev.id)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                      <Trash2 size={14} color={TOKENS.stamp} />
                    </button>
                  </div>
                </div>
              );
            })
          )}
          <Button onClick={() => openNewEvent(dayModal)} style={{ width: "100%", justifyContent: "center" }}>
            <Plus size={15} /> 在這天新增事項
          </Button>
        </Modal>
      )}

      {formOpen && (
        <Modal title={editing ? "編輯事項" : "新增事項"} onClose={() => setFormOpen(false)}>
          <ScheduleEventForm initial={editing} defaultDate={pendingDate} brandEventCount={brandEventCount} onSave={save} onCancel={() => setFormOpen(false)} />
        </Modal>
      )}
    </div>
  );
}

/* ============================================================
   主程式 App
   ============================================================ */
const TABS = [
  { key: "dashboard", label: "總覽", icon: LayoutGrid },
  { key: "orders", label: "訂單", icon: Package },
  { key: "batches", label: "批次", icon: Layers },
  { key: "quotes", label: "報價", icon: Stamp },
  { key: "schedule", label: "行程", icon: Calendar },
  { key: "templates", label: "模板", icon: Copy },
  { key: "expenses", label: "支出", icon: Receipt },
  { key: "summary", label: "損益", icon: TrendingUp },
];

function App() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [orders, setOrders] = useState([]);
  const [batches, setBatches] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [quoteItems, setQuoteItems] = useState([]);
  const [quoteSettings, setQuoteSettings] = useState(DEFAULT_QUOTE_SETTINGS);
  const [scheduleEvents, setScheduleEvents] = useState([]);
  const [arrivalStatuses, setArrivalStatuses] = useState(DEFAULT_ARRIVAL_STATUSES);
  const [templates, setTemplates] = useState(DEFAULT_TEMPLATES);
  const [saveErr, setSaveErr] = useState(false);

  useEffect(() => {
    (async () => {
      const [o, b, e, qi, qs, se, as_, tp] = await Promise.all([
        loadKey("orders", []),
        loadKey("batches", []),
        loadKey("expenses", []),
        loadKey("quoteItems", []),
        loadKey("quoteSettings", DEFAULT_QUOTE_SETTINGS),
        loadKey("scheduleEvents", []),
        loadKey("arrivalStatuses", DEFAULT_ARRIVAL_STATUSES),
        loadKey("templates", DEFAULT_TEMPLATES),
      ]);
      setOrders(o); setBatches(b); setExpenses(e);
      setQuoteItems(qi); setQuoteSettings(qs); setScheduleEvents(se);
      setArrivalStatuses(as_); setTemplates(tp);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) saveKey("orders", orders).catch(() => setSaveErr(true)); }, [orders, loaded]);
  useEffect(() => { if (loaded) saveKey("batches", batches).catch(() => setSaveErr(true)); }, [batches, loaded]);
  useEffect(() => { if (loaded) saveKey("expenses", expenses).catch(() => setSaveErr(true)); }, [expenses, loaded]);
  useEffect(() => { if (loaded) saveKey("quoteItems", quoteItems).catch(() => setSaveErr(true)); }, [quoteItems, loaded]);
  useEffect(() => { if (loaded) saveKey("quoteSettings", quoteSettings).catch(() => setSaveErr(true)); }, [quoteSettings, loaded]);
  useEffect(() => { if (loaded) saveKey("scheduleEvents", scheduleEvents).catch(() => setSaveErr(true)); }, [scheduleEvents, loaded]);
  useEffect(() => { if (loaded) saveKey("arrivalStatuses", arrivalStatuses).catch(() => setSaveErr(true)); }, [arrivalStatuses, loaded]);
  useEffect(() => { if (loaded) saveKey("templates", templates).catch(() => setSaveErr(true)); }, [templates, loaded]);

  const [importMsg, setImportMsg] = useState(null);

  const handleExport = () => {
    try {
      const payload = {
        app: "kr-daigou", version: 1, exportedAt: new Date().toISOString(),
        orders, batches, expenses, quoteItems, quoteSettings, scheduleEvents, arrivalStatuses, templates,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `代購總帳備份-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setImportMsg({ type: "success", text: "已匯出，請確認下載或分享視窗" });
    } catch (err) {
      setImportMsg({ type: "error", text: "匯出失敗，請稍後再試" });
    }
  };

  const handleImportFile = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(String(e.target.result));
        if (!data || typeof data !== "object") throw new Error("format");
        if (!window.confirm("匯入將覆蓋目前所有資料，確定要繼續嗎？")) return;
        setOrders(Array.isArray(data.orders) ? data.orders : []);
        setBatches(Array.isArray(data.batches) ? data.batches : []);
        setExpenses(Array.isArray(data.expenses) ? data.expenses : []);
        setQuoteItems(Array.isArray(data.quoteItems) ? data.quoteItems : []);
        setQuoteSettings(data.quoteSettings && typeof data.quoteSettings === "object" ? data.quoteSettings : DEFAULT_QUOTE_SETTINGS);
        setScheduleEvents(Array.isArray(data.scheduleEvents) ? data.scheduleEvents : []);
        setArrivalStatuses(Array.isArray(data.arrivalStatuses) ? data.arrivalStatuses : DEFAULT_ARRIVAL_STATUSES);
        setTemplates(Array.isArray(data.templates) ? data.templates : DEFAULT_TEMPLATES);
        setImportMsg({ type: "success", text: "匯入成功" });
      } catch (err) {
        setImportMsg({ type: "error", text: "匯入失敗，檔案格式不正確" });
      }
    };
    reader.onerror = () => setImportMsg({ type: "error", text: "讀取檔案失敗" });
    reader.readAsText(file);
  };

  if (!loaded) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
        background: TOKENS.paper, fontFamily: "'Inter', sans-serif", color: TOKENS.inkSoft,
      }}>
        <style>{FONTS_IMPORT}</style>
        <Loader2 size={20} style={{ marginRight: 8, animation: "spin 1s linear infinite" }} />
        載入中...
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", background: TOKENS.paper, fontFamily: "'Inter', sans-serif",
      maxWidth: 480, margin: "0 auto", position: "relative",
    }}>
      <style>{FONTS_IMPORT}</style>
      <div style={{ padding: "calc(env(safe-area-inset-top, 0px) + 14px) 14px 0" }}>
        {tab === "dashboard" && <Dashboard orders={orders} batches={batches} expenses={expenses} setTab={setTab} onExport={handleExport} onImportFile={handleImportFile} importMsg={importMsg} />}
        {tab === "orders" && <OrdersView orders={orders} setOrders={setOrders} batches={batches} statuses={arrivalStatuses} setStatuses={setArrivalStatuses} />}
        {tab === "batches" && <BatchesView batches={batches} setBatches={setBatches} orders={orders} />}
        {tab === "quotes" && <QuotesView items={quoteItems} setItems={setQuoteItems} quoteSettings={quoteSettings} setQuoteSettings={setQuoteSettings} />}
        {tab === "schedule" && <ScheduleView events={scheduleEvents} setEvents={setScheduleEvents} />}
        {tab === "templates" && <TemplatesView templates={templates} setTemplates={setTemplates} />}
        {tab === "expenses" && <ExpensesView expenses={expenses} setExpenses={setExpenses} />}
        {tab === "summary" && <SummaryView orders={orders} batches={batches} expenses={expenses} />}
      </div>

      {saveErr && (
        <div style={{
          position: "fixed", bottom: 74, left: "50%", transform: "translateX(-50%)",
          background: TOKENS.stamp, color: "#fff", padding: "6px 14px", borderRadius: 8, fontSize: 12,
          maxWidth: 440, width: "calc(100% - 40px)", textAlign: "center", zIndex: 200,
        }}>
          儲存失敗，請檢查網路連線後再試一次
        </div>
      )}

      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 480, background: TOKENS.white,
        borderTop: `1.5px solid ${TOKENS.line}`,
        display: "flex", justifyContent: "space-around", padding: "8px 2px calc(env(safe-area-inset-bottom,0px) + 6px)",
        zIndex: 90,
      }}>
        {TABS.map(t => {
          const Icon = t.icon;
          const active = tab === t.key;
          return (
            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              style={{
                background: "none", border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                padding: "3px 1px", flex: 1, minWidth: 0,
              }}
            >
              <Icon size={17} color={active ? TOKENS.stamp : TOKENS.inkSoft} strokeWidth={active ? 2.4 : 1.8} />
              <span style={{
                fontSize: 9, fontWeight: active ? 700 : 500,
                color: active ? TOKENS.stamp : TOKENS.inkSoft,
                fontFamily: "'Inter', sans-serif",
                whiteSpace: "nowrap",
              }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}
</script>

<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-loading");
    if (el && !el.classList.contains("hide")) {
      el.innerHTML =
        '<div style="color:#111111;font-weight:600;padding:0 24px;text-align:center;">載入失敗，請確認網路連線後重新整理<br/><span style="font-size:11px;opacity:0.7;word-break:break-all;">' +
        String(e.message || e).replace(/</g, "&lt;") +
        "</span></div>";
    }
  });

  window.storage = {
    _NS: "kr_daigou_v1__",
    get: function (key, shared) {
      var self = this;
      return Promise.resolve().then(function () {
        try {
          var raw = localStorage.getItem(self._NS + key);
          if (raw === null) return null;
          return { key: key, value: raw, shared: !!shared };
        } catch (e) { return null; }
      });
    },
    set: function (key, value, shared) {
      var self = this;
      return Promise.resolve().then(function () {
        try {
          localStorage.setItem(self._NS + key, value);
          return { key: key, value: value, shared: !!shared };
        } catch (e) { return null; }
      });
    },
    delete: function (key, shared) {
      var self = this;
      return Promise.resolve().then(function () {
        try {
          localStorage.removeItem(self._NS + key);
          return { key: key, deleted: true, shared: !!shared };
        } catch (e) { return null; }
      });
    },
    list: function (prefix, shared) {
      var self = this;
      return Promise.resolve().then(function () {
        try {
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(self._NS) === 0) {
              var short = k.slice(self._NS.length);
              if (!prefix || short.indexOf(prefix) === 0) keys.push(short);
            }
          }
          return { keys: keys, prefix: prefix, shared: !!shared };
        } catch (e) { return null; }
      });
    },
  };

  try {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, { presets: ["react"], filename: "app.jsx" }).code;
    (0, eval)(compiled);
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    document.getElementById("boot-loading").classList.add("hide");
  } catch (err) {
    console.error(err);
    var el = document.getElementById("boot-loading");
    el.innerHTML =
      '<div style="color:#111111;font-weight:600;padding:0 24px;text-align:center;">程式載入失敗<br/><span style="font-size:11px;opacity:0.7;word-break:break-all;">' +
      (err && err.message ? String(err.message).replace(/</g, "&lt;") : "unknown error") +
      "</span></div>";
  }
</script>
</body>
</html>
